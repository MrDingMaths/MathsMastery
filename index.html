<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Mastery</title>
    <script src="shared/darkMode.js"></script>
    <link rel="stylesheet" href="shared/darkMode.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/navigationButtons.css">
    <link rel="stylesheet" href="shared/leaderboard.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* ===== DESIGN TOKENS ===== */
        :root {
            --font-display: 'Fredoka', sans-serif;
            --font-ui: 'Nunito', system-ui, sans-serif;
            --c-green: #2fa45a;
            --c-blue:  #3a6fe0;
            --c-red:   #ee5d6e;
            --ink:      #1d2230;
            --ink-soft: #6b7280;
            --ink-faint:#9aa1ad;
            --bg:   #eef1f7;
            --card: #ffffff;
            --line: #e7eaf1;
            --shadow-card: 0 14px 34px -16px rgba(34,42,66,.32), 0 2px 6px rgba(34,42,66,.05);
            --shadow-rail: 0 8px 22px -14px rgba(34,42,66,.22), 0 1px 3px rgba(34,42,66,.05);
            --radius: 24px;
        }

        [data-theme="dark"] {
            --ink:      #e8e4da;
            --ink-soft: #9ca3af;
            --ink-faint:#6b7280;
            --bg:   #111827;
            --card: #1f2937;
            --line: rgba(255,255,255,.1);
        }

        /* ===== BASE ===== */
        html { min-height: 100%; }

        body {
            font-family: var(--font-ui);
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            margin: 0;
        }

        body.grid-on {
            background-image:
                linear-gradient(rgba(120,130,160,.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120,130,160,.07) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ===== SHELL ===== */
        .mm-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 28px 80px;
        }

        /* ===== HERO ===== */
        .mm-hero {
            text-align: center;
            margin: 28px 0 38px;
        }

        .mm-hero h1 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 60px;
            line-height: 1.02;
            margin: 0;
            letter-spacing: -.5px;
            color: var(--ink);
        }

        .mm-hero p {
            margin: 10px 0 0;
            font-size: 20px;
            color: var(--ink-soft);
            font-weight: 600;
        }

        /* ===== TOPIC CARDS ===== */
        .mm-topics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 26px;
        }

        .mm-card {
            position: relative;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 34px 30px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.6);
            transition: transform .18s cubic-bezier(.3,.7,.4,1), box-shadow .18s;
        }

        [data-theme="dark"] .mm-card { border-color: rgba(255,255,255,.06); }

        .mm-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 7px;
        }

        .mm-card.t-green::before { background: var(--c-green); }
        .mm-card.t-blue::before  { background: var(--c-blue); }
        .mm-card.t-red::before   { background: var(--c-red); }

        .mm-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 26px 50px -20px rgba(34,42,66,.4), 0 4px 10px rgba(34,42,66,.07);
        }

        .mm-glyph {
            width: 82px;
            height: 82px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 38px;
            font-weight: 600;
            margin: 8px 0 20px;
            box-shadow: 0 12px 24px -10px rgba(0,0,0,.45);
        }

        .t-green .mm-glyph { background: var(--c-green); }
        .t-blue  .mm-glyph { background: var(--c-blue); }
        .t-red   .mm-glyph { background: var(--c-red); }

        .mm-card h3 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 27px;
            margin: 0 0 14px;
            color: var(--ink);
        }

        .mm-start {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: none;
            color: #fff;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 18px;
            padding: 13px 30px;
            border-radius: 999px;
            transition: gap .15s, filter .15s, transform .1s;
            pointer-events: none; /* click handled by <a> parent */
        }

        .t-green .mm-start { background: var(--c-green); box-shadow: 0 10px 20px -10px var(--c-green); }
        .t-blue  .mm-start { background: var(--c-blue);  box-shadow: 0 10px 20px -10px var(--c-blue); }
        .t-red   .mm-start { background: var(--c-red);   box-shadow: 0 10px 20px -10px var(--c-red); }

        .mm-card:hover .mm-start { gap: 14px; filter: brightness(1.06); }
        .mm-start:active { transform: scale(.97); }

        /* ===== RAILS ===== */
        .mm-rails {
            display: grid;
            grid-template-columns: 1.45fr 1fr;
            gap: 26px;
            margin-top: 30px;
        }

        .mm-panel {
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow-rail);
            border: 1px solid var(--line);
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
        }

        .mm-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .mm-panel-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 19px;
            color: var(--ink);
        }

        .mm-sublabel {
            font-size: 13px;
            font-weight: 600;
            color: var(--c-red);
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .mm-link {
            background: none;
            border: none;
            color: var(--c-blue);
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            font-family: var(--font-ui);
        }

        .mm-link:hover { background: rgba(58,111,224,.08); }

        /* ===== PANEL BODY (populated by hubLeaderboard.js) ===== */
        .panel-body {
            flex: 1;
            overflow-y: auto;
            max-height: 600px;
            padding: 4px 2px 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,.18) transparent;
        }

        [data-theme="dark"] .panel-body { scrollbar-color: rgba(255,255,255,.18) transparent; }

        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }
        .panel-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 9999px; }
        .panel-body::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.32); }
        [data-theme="dark"] .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }
        [data-theme="dark"] .panel-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.32); }

        /* ===== RECENT ACTIVITY ENTRIES (rendered by hubLeaderboard.js) ===== */
        .panel-entry {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
            padding: .45rem .375rem;
            border-radius: .375rem;
        }
        .panel-entry:hover { background: rgba(0,0,0,.03); }
        [data-theme="dark"] .panel-entry:hover { background: rgba(255,255,255,.04); }
        .panel-entry + .panel-entry { border-top: 1px solid var(--line); }

        .panel-badge {
            flex-shrink: 0;
            font-size: .65rem;
            font-weight: 700;
            padding: .15rem .35rem;
            border-radius: .3rem;
            margin-top: .2rem;
            line-height: 1.4;
        }
        .panel-badge-mathsfacts { background: #dcfce7; color: #15803d; }
        .panel-badge-algebra    { background: #dbeafe; color: #1d4ed8; }
        .panel-badge-trigfacts  { background: #fce7f3; color: #be185d; }
        [data-theme="dark"] .panel-badge-mathsfacts { background: rgba(21,128,61,.2);  color: #4ade80; }
        [data-theme="dark"] .panel-badge-algebra    { background: rgba(29,78,216,.25); color: #93c5fd; }
        [data-theme="dark"] .panel-badge-trigfacts  { background: rgba(190,24,93,.2);  color: #f9a8d4; }

        .panel-entry-body { display: flex; flex-direction: column; gap: .05rem; min-width: 0; flex: 1; }
        .panel-entry-name   { font-size: .85rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-entry-detail { font-size: .78rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-entry-time   { font-size: .72rem; color: var(--ink-faint); }

        /* ===== HALL OF FAME TABS (class names kept for hubLeaderboard.js) ===== */
        .panel-hof-tabs {
            display: flex;
            gap: 7px;
            background: rgba(0,0,0,.05);
            padding: 5px;
            border-radius: 13px;
            margin: 10px 0 6px;
        }

        [data-theme="dark"] .panel-hof-tabs { background: rgba(255,255,255,.07); }

        .panel-hof-tab {
            flex: 1;
            border: none;
            background: transparent;
            border-radius: 9px;
            padding: 9px 4px;
            font-weight: 700;
            font-size: 16px;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all .14s;
            font-family: var(--font-ui);
        }

        .panel-hof-tab:hover { color: var(--ink); }

        .panel-hof-tab.panel-hof-tab-active {
            background: var(--card);
            color: var(--ink);
            box-shadow: 0 2px 6px rgba(34,42,66,.12);
        }

        /* ===== HALL OF FAME ENTRIES (rendered by hubLeaderboard.js) ===== */
        .panel-hof-entry {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .375rem;
            border-radius: .375rem;
        }
        .panel-hof-entry:hover { background: rgba(0,0,0,.03); }
        [data-theme="dark"] .panel-hof-entry:hover { background: rgba(255,255,255,.04); }
        .panel-hof-entry + .panel-hof-entry { border-top: 1px solid var(--line); }

        .panel-hof-rank {
            width: 26px;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            color: var(--ink-faint);
            flex: none;
            line-height: 1;
        }

        .panel-hof-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--c-blue);
            color: #fff;
            font-size: .75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .panel-hof-avatar.panel-hof-avatar-img { background: none; object-fit: cover; }

        .panel-hof-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
        .panel-hof-name { font-size: .85rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .panel-hof-medals { display: flex; flex-wrap: wrap; gap: .2rem; }

        .panel-medal {
            font-size: .68rem;
            background: rgba(0,0,0,.05);
            border-radius: .3rem;
            padding: .05rem .25rem;
            color: var(--ink);
            line-height: 1.5;
        }
        [data-theme="dark"] .panel-medal { background: rgba(255,255,255,.08); }

        .panel-loading, .panel-empty {
            font-size: .85rem;
            color: var(--ink-soft);
            padding: .875rem .5rem;
            text-align: center;
        }

        /* ===== SIGN-IN PROMPT ===== */
        .mm-signin-prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 28px 16px;
            text-align: center;
        }

        .mm-signin-prompt p {
            margin: 0;
            font-size: 14px;
            color: var(--ink-soft);
            font-weight: 600;
        }

        .mm-signin-prompt-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #4285F4;
            color: #fff;
            font-weight: 700;
            font-size: .875rem;
            font-family: var(--font-ui);
            border: none;
            border-radius: 8px;
            padding: .6rem 1.25rem;
            cursor: pointer;
            transition: opacity .15s, box-shadow .15s;
            box-shadow: 0 2px 8px rgba(66,133,244,.35);
        }

        .mm-signin-prompt-btn:hover {
            opacity: .92;
            box-shadow: 0 4px 16px rgba(66,133,244,.5);
        }

        /* ===== HUB LEADERBOARD MODAL ===== */
        .hub-lb-hidden { display: none !important; }

        #hub-lb-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        #hub-lb-modal {
            background: var(--card);
            border-radius: 1rem;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px rgba(0,0,0,.3);
            overflow: hidden;
        }

        .hub-lb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.125rem 1.25rem 1rem;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        .hub-lb-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }

        #hub-lb-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            line-height: 1;
            color: var(--ink-soft);
            cursor: pointer;
            padding: .25rem .375rem;
            border-radius: .375rem;
        }
        #hub-lb-close:hover { background: rgba(0,0,0,.06); color: var(--ink); }
        [data-theme="dark"] #hub-lb-close:hover { background: rgba(255,255,255,.08); }

        .hub-lb-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }

        .hub-lb-tab {
            flex: 1;
            background: none;
            border: none;
            padding: .7rem .5rem;
            font-size: .8rem;
            font-weight: 600;
            color: var(--ink-soft);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
            font-family: inherit;
        }
        .hub-lb-tab:hover { color: var(--ink); }
        .hub-lb-tab-active { color: #3b82f6; border-bottom-color: #3b82f6; }
        [data-theme="dark"] .hub-lb-tab-active { color: #60a5fa; border-bottom-color: #60a5fa; }

        #hub-lb-content {
            overflow-y: auto;
            flex: 1;
            padding: .75rem 1rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,0,0,.18) transparent;
        }
        [data-theme="dark"] #hub-lb-content { scrollbar-color: rgba(255,255,255,.18) transparent; }
        #hub-lb-content::-webkit-scrollbar { width: 4px; }
        #hub-lb-content::-webkit-scrollbar-track { background: transparent; }
        #hub-lb-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 9999px; }
        #hub-lb-content::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.32); }
        [data-theme="dark"] #hub-lb-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); }

        .hub-lb-group { margin-bottom: .5rem; }
        .hub-lb-group-name { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); padding: .625rem .25rem .375rem; }

        .hub-lb-level-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .5rem .625rem;
            border-radius: .5rem;
            cursor: pointer;
            font-size: .875rem;
            color: var(--ink);
            transition: background .1s;
        }
        .hub-lb-level-row:hover { background: rgba(0,0,0,.04); }
        [data-theme="dark"] .hub-lb-level-row:hover { background: rgba(255,255,255,.05); }
        .hub-lb-level-row-open { background: rgba(59,130,246,.07); color: #1d4ed8; }
        [data-theme="dark"] .hub-lb-level-row-open { background: rgba(59,130,246,.15); color: #93c5fd; }

        .hub-lb-level-name { flex: 1; }
        .hub-lb-chevron { font-size: 1.1rem; color: var(--ink-soft); transition: transform .2s; line-height: 1; margin-left: .5rem; }
        .hub-lb-level-row-open .hub-lb-chevron { transform: rotate(90deg); color: #3b82f6; }
        [data-theme="dark"] .hub-lb-level-row-open .hub-lb-chevron { color: #60a5fa; }

        .hub-lb-level-panel { padding: .375rem .625rem .75rem; }
        .hub-lb-loading { text-align: center; font-size: .825rem; color: var(--ink-soft); padding: .75rem 0; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .mm-topics { grid-template-columns: 1fr; }
            .mm-rails  { grid-template-columns: 1fr; }
            .mm-hero h1 { font-size: 46px; }
            .mm-shell { padding: 20px 20px 80px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .mm-card, .mm-start { transition: none; }
        }
    </style>
</head>
<body class="grid-on">

    <div class="mm-shell">

        <div class="mm-hero">
            <h1>What shall we practise?</h1>
            <p>Pick a topic and jump straight in.</p>
        </div>

        <div class="mm-topics">

            <a href="./mathsfacts/" class="mm-card t-green">
                <div class="mm-glyph">±</div>
                <h3>Number Skills</h3>
                <span class="mm-start">Start <span>→</span></span>
            </a>

            <a href="./algebra/" class="mm-card t-blue">
                <div class="mm-glyph">𝑥</div>
                <h3>Algebra Skills</h3>
                <span class="mm-start">Start <span>→</span></span>
            </a>

            <a href="./trigfacts/" class="mm-card t-red">
                <div class="mm-glyph">θ</div>
                <h3>Trig Skills</h3>
                <span class="mm-start">Start <span>→</span></span>
            </a>

        </div>

        <div class="mm-rails">

            <!-- Recent Activity -->
            <div class="mm-panel" id="panel-recent">
                <div class="mm-panel-head">
                    <div class="mm-panel-title"><span>🎉</span> Recent Masteries</div>
                    <span class="mm-sublabel">Live</span>
                </div>
                <div class="panel-body">
                    <div class="mm-signin-prompt">
                        <p>Sign in to see live activity.</p>
                        <button class="mm-signin-prompt-btn">Sign in with Google</button>
                    </div>
                </div>
            </div>

            <!-- Hall of Fame -->
            <div class="mm-panel" id="panel-hof">
                <div class="mm-panel-head">
                    <div class="mm-panel-title"><span>👑</span> Hall of Fame</div>
                    <button class="mm-link" id="hub-lb-open-btn">Full leaderboard →</button>
                </div>
                <div class="panel-hof-tabs">
                    <button class="panel-hof-tab panel-hof-tab-active" data-app="mathsfacts">Number</button>
                    <button class="panel-hof-tab" data-app="algebra">Algebra</button>
                    <button class="panel-hof-tab" data-app="trigfacts">Trig</button>
                </div>
                <div class="panel-body">
                    <div class="mm-signin-prompt">
                        <p>Sign in to see the Hall of Fame.</p>
                        <button class="mm-signin-prompt-btn">Sign in with Google</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer style="position:fixed;bottom:1rem;left:1rem;right:0;text-align:left;z-index:1;">
        <a href="/privacy-policy.html" style="font-size:.75rem;color:var(--ink-soft);text-decoration:none;opacity:.6;transition:opacity .15s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.6'">Privacy Policy</a>
    </footer>

    <!-- Hub leaderboard modal -->
    <div id="hub-lb-overlay" class="hub-lb-hidden">
        <div id="hub-lb-modal">
            <div class="hub-lb-header">
                <h2>🏅 Leaderboards</h2>
                <button id="hub-lb-close" aria-label="Close leaderboard">✕</button>
            </div>
            <div class="hub-lb-tabs">
                <button class="hub-lb-tab hub-lb-tab-active" data-app="mathsfacts">Number Skills</button>
                <button class="hub-lb-tab" data-app="algebra">Algebra Skills</button>
                <button class="hub-lb-tab" data-app="trigfacts">Trig Skills</button>
            </div>
            <div id="hub-lb-content"></div>
        </div>
    </div>

    <script src="shared/supabaseClient.js"></script>
    <script src="shared/leaderboard.js"></script>
    <script src="shared/hubLeaderboard.js"></script>
    <script src="shared/navigationButtons.js"></script>
    <script>
        (function () {
            function signIn() {
                if (window.supabaseClient) {
                    window.supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin + window.location.pathname }
                    });
                }
            }

            function showSignInPrompts() {
                const promptHtml = (msg) =>
                    '<div class="mm-signin-prompt">' +
                    '<p>' + msg + '</p>' +
                    '<button class="mm-signin-prompt-btn">Sign in with Google</button>' +
                    '</div>';
                const recentBody = document.querySelector('#panel-recent .panel-body');
                const hofBody    = document.querySelector('#panel-hof .panel-body');
                if (recentBody) recentBody.innerHTML = promptHtml('Sign in to see live activity.');
                if (hofBody)    hofBody.innerHTML    = promptHtml('Sign in to see the Hall of Fame.');
            }

            document.addEventListener('click', function (e) {
                if (e.target.closest('.mm-signin-prompt-btn')) signIn();
            });

            function updatePanels(detail) {
                const user = detail && detail.user;
                if (user) {
                    if (window.hubPanels) window.hubPanels.show(user);
                } else {
                    if (window.hubPanels) window.hubPanels.hide();
                    showSignInPrompts();
                }
            }

            document.addEventListener('supabase-auth-change', function (e) {
                updatePanels(e.detail);
            });

            if (typeof window.supabaseUser !== 'undefined') {
                updatePanels({ user: window.supabaseUser });
            }
        })();
    </script>
</body>
</html>
