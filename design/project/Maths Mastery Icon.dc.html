<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</helmet>
<div style="min-width:100%; min-height:100vh; box-sizing:border-box; padding:56px; background:#0f1115; width:max-content; font-family:'Fredoka',sans-serif;">

  <div style="margin-bottom:48px;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:#6b7280;">Brand mark · final</div>
    <div style="font-size:36px; font-weight:600; color:#f3f4f6; margin-top:10px; letter-spacing:-0.01em;">Maths Mastery</div>
    <div style="font-size:15px; color:#9ca3af; margin-top:6px; max-width:560px;">The Fredoka "M" wrapped by the drill-progress ring filled to mastery — the app's monogram tile and its signature ring in one mark.</div>
  </div>

  <div style="display:flex; gap:36px; align-items:flex-start;">

    <!-- HERO MARK -->
    <div style="flex:none; width:336px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#7c8190; margin-bottom:14px;">The mark</div>
      <div style="background:#fafaf8; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.4); padding:52px; display:flex; align-items:center; justify-content:center;">
        <svg width="232" height="232" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="16" stroke="#e7e3da" stroke-width="4"/>
          <circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/>
          <text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#11131a">M</text>
        </svg>
      </div>
    </div>

    <!-- SIZES light/dark -->
    <div style="flex:none; width:336px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#7c8190; margin-bottom:14px;">At icon sizes</div>
      <div style="background:#fafaf8; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.4); overflow:hidden;">
        <div style="padding:34px; display:flex; align-items:flex-end; justify-content:center; gap:26px;">
          <svg width="64" height="64" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#e7e3da" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#11131a">M</text></svg>
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#e7e3da" stroke-width="4.5"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#11131a">M</text></svg>
          <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#e7e3da" stroke-width="5"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="700" font-size="20" fill="#11131a">M</text></svg>
        </div>
        <div style="padding:34px; display:flex; align-items:flex-end; justify-content:center; gap:26px; background:#11131a; border-top:1px solid #ececec;">
          <svg width="64" height="64" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#2c2f39" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#f3f4f6">M</text></svg>
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#2c2f39" stroke-width="4.5"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#f3f4f6">M</text></svg>
          <svg width="24" height="24" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#2c2f39" stroke-width="5"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="5" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="700" font-size="20" fill="#f3f4f6">M</text></svg>
        </div>
      </div>
    </div>

    <!-- App tile / favicon -->
    <div style="flex:none; width:336px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#7c8190; margin-bottom:14px;">App tile</div>
      <div style="background:#fafaf8; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.4); padding:44px; display:flex; align-items:center; justify-content:center; gap:28px;">
        <div style="width:120px; height:120px; border-radius:27px; background:#11131a; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(0,0,0,.28);">
          <svg width="88" height="88" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#2c2f39" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#f3f4f6">M</text></svg>
        </div>
        <div style="width:120px; height:120px; border-radius:27px; background:#ECA02E; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(0,0,0,.28);">
          <svg width="88" height="88" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="rgba(255,255,255,.32)" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#ffffff">M</text></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- lockups -->
  <div style="margin-top:36px; display:flex; gap:36px; align-items:flex-start;">
    <div style="flex:none; width:516px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#7c8190; margin-bottom:14px;">Lockup · light</div>
      <div style="background:#fafaf8; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.4); padding:34px; display:flex; align-items:center; gap:16px;">
        <svg width="46" height="46" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#e7e3da" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#11131a">M</text></svg>
        <span style="font-size:28px; font-weight:600; color:#11131a; letter-spacing:-0.01em;">Maths <span style="color:#ECA02E;">Mastery</span></span>
      </div>
    </div>
    <div style="flex:none; width:516px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#7c8190; margin-bottom:14px;">Lockup · dark</div>
      <div style="background:#11131a; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.4); padding:34px; display:flex; align-items:center; gap:16px;">
        <svg width="46" height="46" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="#2c2f39" stroke-width="4"/><circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/><text x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19" fill="#f3f4f6">M</text></svg>
        <span style="font-size:28px; font-weight:600; color:#f3f4f6; letter-spacing:-0.01em;">Maths <span style="color:#ECA02E;">Mastery</span></span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
