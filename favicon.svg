  </style>
  <circle class="ring-track" cx="24" cy="24" r="16" stroke-width="4"/>
  <circle cx="24" cy="24" r="16" stroke="#ECA02E" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 101" transform="rotate(-90 24 24)"/>
  <text class="m-letter" x="24" y="24.2" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="19">M</text>
</svg>
