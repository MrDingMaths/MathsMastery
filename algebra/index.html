<body class="chalkboard flex items-center justify-center min-h-screen p-4">

    <canvas id="confetti-canvas"></canvas>

    <div class="container mx-auto text-center">

        <div id="settings-screen"></div>

        <div id="game-screen" class="card mx-auto hidden">
            <div class="flex justify-between items-center mb-6 text-lg">
                <div class="font-semibold text-gray-700">Streak: <span id="streak-counter" class="font-bold text-blue-600 text-xl">0</span>🔥</div>
                <div class="font-semibold text-gray-700">Time: <span id="timer" class="font-bold text-blue-600 text-xl">00:00</span></div>
            </div>
            <div id="level-name" class="text-center text-gray-700 text-xl mb-2"></div>
            <span id="timer-paused-message" class="hidden font-semibold text-orange-600">
                Timer will reset
            </span>
            <div id="question-container" class="my-12 min-h-[60px] flex items-center justify-center">
                <div id="question-text" class="question-text algebra-question"></div>
            </div>
            <div id="feedback-message" class="feedback mb-6"></div>

            <button id="quit-btn" tabindex="-1" class="text-gray-500 hover:text-gray-700 font-semibold"><span class="dcg">Esc</span> Back to Levels</button>
        </div>

        <div id="success-screen" class="card mx-auto hidden">

            <!-- Header: icon circle + title/rating/level -->
            <div class="success-header">
                <div id="rating-icon-circle" class="success-icon-circle">
                    <span id="rating-emoji" class="success-icon-emoji"></span>
                </div>
                <div class="success-header-text">
                    <div class="success-challenge-label">🎉 Challenge Complete!</div>
                    <div id="final-rating" class="success-rating-name"></div>
                    <div id="completed-level" class="success-level-name"></div>
                </div>
            </div>

            <!-- Time panel -->
            <div class="success-time-card">
                <div class="success-time-left">
                    <div class="success-time-label">YOUR TIME</div>
                    <div class="success-time-row">
                        <span id="final-time" class="success-time-value"></span>
                        <span id="new-best-badge" class="success-new-best hidden">⭐ New best</span>
                    </div>
                </div>
                <div id="previous-best-section" class="success-time-right hidden">
                    <div class="success-prev-label">Previous best</div>
                    <div id="previous-best-time" class="success-prev-time"></div>
                </div>
            </div>

            <!-- Rating progress timeline (rendered by JS) -->
            <div id="rating-timeline" class="success-timeline"></div>

            <!-- Next rating hint -->
            <div id="rating-hint" class="success-rating-hint hidden">
                <span class="success-hint-icon">🏆</span>
                <span id="rating-hint-text"></span>
            </div>

            <!-- Action buttons -->
            <div class="success-actions">
                <button id="replay-level-btn" class="btn btn-primary flex items-center justify-center gap-2 flex-1">
                    <span class="dcg">Enter</span><span>Replay Level</span>
                </button>
                <button id="play-again-btn" tabindex="-1" class="success-back-btn">
                    <span class="dcg">Esc</span>
                    <span>Back to Levels</span>
                </button>
            </div>
        </div>

    </div>
